name: Temporary bootstrap diagnostics

on:
  pull_request:
    branches:
      - agent/architecture-rewrite

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-bootstrap
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Capture failing test output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tester.target_deployment_bootstrap_tester \
            tester.target_market_data_migration_tester \
            tester.target_execution_broker_attempt_tester \
            tester.target_execution_daily_risk_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_reverse_finalization_tester \
            -v > bootstrap-debug.log 2>&1
          status=$?
          echo "exit_code=$status" >> bootstrap-debug.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-debug
          path: bootstrap-debug.log
          if-no-files-found: error
