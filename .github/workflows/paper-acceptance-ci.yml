name: Paper acceptance runner CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/paper-acceptance-runner
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-paper-acceptance-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-acceptance-ci
      IBMD_DATA_ROOT: /tmp/ibmd-paper-acceptance-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run runner and broker-safety tests
        run: |
          python -m unittest \
            tester.target_paper_acceptance_drill_tester \
            tester.target_execution_paper_submit_tester \
            tester.target_execution_paper_order_regression_tester \
            tester.target_execution_protection_tester \
            tester.target_execution_protective_submit_tester \
            tester.target_execution_protective_uncertainty_tester \
            -v

      - name: Create a fresh target root and validate the runner
        run: |
          rm -rf /tmp/ibmd-paper-acceptance-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_paper_acceptance_drill.py --validate-only

      - name: Ensure the runner is non-interactive
        run: |
          ! grep -R "Read-Host\|input(" \
            scripts/run_paper_acceptance_drill.py \
            src/ibmd/operations/paper_acceptance.py

      - name: Compile and lint runner files
        run: |
          python -m compileall -q \
            scripts/run_paper_acceptance_drill.py \
            src/ibmd/operations/paper_acceptance.py \
            tester/target_paper_acceptance_drill_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            scripts/run_paper_acceptance_drill.py \
            src/ibmd/operations/paper_acceptance.py \
            tester/target_paper_acceptance_drill_tester.py
