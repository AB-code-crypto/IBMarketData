name: Liquidation trigger producer CI

on:
  pull_request:
    branches:
      - master
      - agent/architecture-rewrite
  push:
    branches:
      - agent/liquidation-trigger-producers
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-liquidation-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-protective
      IBMD_DATA_ROOT: /tmp/ibmd-liquidation-trigger-ci
      IBMD_APPLICATION_VERSION: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run trigger and liquidation tests
        run: |
          python -m unittest \
            tester.target_execution_liquidation_trigger_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_paper_liquidation_tester \
            tester.target_execution_protective_lifecycle_tester \
            -v

      - name: Validate fresh target schemas and entrypoint
        run: |
          rm -rf "$IBMD_DATA_ROOT"
          python scripts/run_target_migrations.py \
            --manifest migrations/execution.v1.json \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_liquidation_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_execution_liquidation_triggers_v2.py \
            --validate-store-only
          python apps/run_execution_liquidation_triggers_v2.py --help >/dev/null

      - name: Compile and lint trigger files
        run: |
          python -m compileall -q \
            apps/run_execution_liquidation_triggers_v2.py \
            src/ibmd/execution/application/liquidation_triggers.py \
            src/ibmd/execution/adapters/sqlite_liquidation_triggers.py \
            tester/target_execution_liquidation_trigger_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_liquidation_triggers_v2.py \
            src/ibmd/execution/application/liquidation_triggers.py \
            src/ibmd/execution/adapters/sqlite_liquidation_triggers.py \
            tester/target_execution_liquidation_trigger_tester.py
