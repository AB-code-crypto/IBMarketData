name: Runtime authorization CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/runtime-authorization-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-runtime-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-soak-authorization-ci
      IBMD_DATA_ROOT: /tmp/ibmd-runtime-authorization-ci/account1
      IBMD_APPLICATION_VERSION: authorization-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run authorization, preflight and supervisor tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_runtime_authorization_tester \
            tester.target_cutover_preflight_tester \
            tester.target_supervisor_tester \
            tester.target_execution_runtime_tester \
            -v 2>&1 | tee /tmp/runtime-authorization-tests.txt

      - name: Upload authorization test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-authorization-tests
          path: /tmp/runtime-authorization-tests.txt

      - name: Fail when authorization tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Bootstrap and generate acceptance evidence
        run: |
          rm -rf /tmp/ibmd-runtime-authorization-ci /tmp/runtime-auth-summaries
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str((Path.cwd() / 'src').resolve()))

          from ibmd.foundation.atomic_json import atomic_write_json
          from ibmd.operations.acceptance_manifest import AcceptanceGate
          from tester.target_cutover_preflight_tester import summary

          root = Path('/tmp/runtime-auth-summaries')
          root.mkdir(parents=True, exist_ok=True)
          for gate in AcceptanceGate:
              atomic_write_json(
                  root / f'{gate.value.lower()}.json',
                  summary(gate),
              )
          PY
          python scripts/build_target_acceptance_manifest.py \
            --build \
            --entry-summary /tmp/runtime-auth-summaries/entry_protection.json \
            --liquidation-summary /tmp/runtime-auth-summaries/liquidation.json \
            --restart-summary /tmp/runtime-auth-summaries/restart.json \
            --liquidation-restart-summary /tmp/runtime-auth-summaries/liquidation_restart.json \
            --reverse-summary /tmp/runtime-auth-summaries/reverse.json \
            --daily-halt-summary /tmp/runtime-auth-summaries/daily_halt.json \
            --daily-flat-summary /tmp/runtime-auth-summaries/daily_flat.json \
            --rollover-summary /tmp/runtime-auth-summaries/rollover.json
          python scripts/run_target_cutover_preflight.py \
            --mode PAPER_SOAK \
            --issue-authorization \
            --allow-unqualified-session \
            --legacy-runtime-dir /tmp/no-legacy-runtime

      - name: Validate authorization wrapper without starting execution
        run: |
          python apps/run_execution_authorized_runtime_v2.py \
            --runtime-authorization "$IBMD_DATA_ROOT/runtime/authorization.json" \
            --validate-authorization-only \
            > /tmp/runtime-authorization-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path('/tmp/runtime-authorization-proof.json').read_text()
          )
          assert value['continuous_broker_mutations_authorized'] is True
          assert value['continuous_broker_mutation_adapters_enabled'] is False
          assert value['execution_runtime_started'] is False
          assert value['live_account_enablement'] is False
          PY

      - name: Validate supervisor authorized plan
        run: |
          python apps/run_target_supervisor.py \
            --print-plan \
            --runtime-authorization "$IBMD_DATA_ROOT/runtime/authorization.json" \
            > /tmp/authorized-supervisor-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path('/tmp/authorized-supervisor-plan.json').read_text()
          )
          assert value['runtime_authorization_verified'] is True
          assert value['continuous_broker_mutations_authorized'] is True
          assert value['continuous_broker_mutation_adapters_enabled'] is False
          execution = next(
              item for item in value['services']
              if item['service'] == 'execution'
          )
          assert execution['argv'][1].endswith(
              'apps/run_execution_authorized_runtime_v2.py'
          )
          PY

      - name: Prove missing and tampered authorization fail closed
        run: |
          ! python apps/run_execution_authorized_runtime_v2.py \
            --runtime-authorization /tmp/does-not-exist.json \
            --validate-authorization-only
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path(
              '/tmp/ibmd-runtime-authorization-ci/account1/'
              'runtime/acceptance/evidence/entry_protection.summary.json'
          )
          value = json.loads(path.read_text())
          value['entry_submission_count'] = 2
          path.write_text(json.dumps(value), encoding='utf-8')
          PY
          ! python apps/run_execution_authorized_runtime_v2.py \
            --runtime-authorization "$IBMD_DATA_ROOT/runtime/authorization.json" \
            --validate-authorization-only

      - name: Compile authorization files
        run: |
          python -m compileall -q \
            apps/run_execution_authorized_runtime_v2.py \
            apps/run_target_supervisor.py \
            src/ibmd/operations/runtime_authorization.py \
            tester/target_runtime_authorization_tester.py

      - name: Lint authorization files
        id: lint
        continue-on-error: true
        run: |
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_authorized_runtime_v2.py \
            apps/run_target_supervisor.py \
            src/ibmd/operations/runtime_authorization.py \
            tester/target_runtime_authorization_tester.py \
            2>&1 | tee /tmp/runtime-authorization-lint.txt

      - name: Upload authorization lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-authorization-lint
          path: /tmp/runtime-authorization-lint.txt

      - name: Fail when authorization lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
