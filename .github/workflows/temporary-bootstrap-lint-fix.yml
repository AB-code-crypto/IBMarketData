name: Temporary bootstrap lint fix

on:
  pull_request:
    branches:
      - agent/architecture-rewrite

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ibmd/operations/bootstrap/target.py')
          text = path.read_text(encoding='utf-8')
          old = 'import hashlib\nimport json\nimport os\n'
          new = 'import hashlib\nimport os\n'
          if text.count(old) != 1:
              raise SystemExit('expected one bootstrap json import block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/operations/bootstrap/target.py
          git diff --cached --quiet || git commit -m "Remove unused bootstrap import"
          git push origin HEAD:agent/target-bootstrap
