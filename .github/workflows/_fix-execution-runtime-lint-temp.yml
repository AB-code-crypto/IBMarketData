name: Temporary execution runtime lint fix

on:
  push:
    branches:
      - agent/execution-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: |
          ruff check --select E4,E7,E9,F --ignore E402 --fix \
            apps/run_execution_runtime_v2.py \
            src/ibmd/execution/application/runtime.py \
            src/ibmd/execution/application/runtime_steps.py \
            src/ibmd/execution/adapters/sqlite_runtime.py \
            tester/target_execution_runtime_tester.py \
            tester/target_execution_runtime_reader_tester.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/run_execution_runtime_v2.py \
            src/ibmd/execution/application/runtime.py \
            src/ibmd/execution/application/runtime_steps.py \
            src/ibmd/execution/adapters/sqlite_runtime.py \
            tester/target_execution_runtime_tester.py \
            tester/target_execution_runtime_reader_tester.py
          git diff --cached --quiet || git commit -m "Fix execution runtime lint"
          git push origin HEAD:agent/execution-runtime
