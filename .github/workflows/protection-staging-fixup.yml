name: Protection staging fixup

on:
  push:
    branches:
      - agent/execution-protection-foundation-staging

permissions:
  contents: write

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/execution-protection-foundation-staging
          fetch-depth: 0

      - name: Advance broker-attempt schema and remove one-shot workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ibmd/execution/adapters/sqlite_broker_attempts.py')
          text = path.read_text(encoding='utf-8')
          old = 'BROKER_ATTEMPT_SCHEMA_VERSION = 2'
          new = 'BROKER_ATTEMPT_SCHEMA_VERSION = 3'
          if old not in text and new not in text:
              raise SystemExit('broker-attempt schema constant not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/protection-staging-fixup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/execution/adapters/sqlite_broker_attempts.py
          git commit -m "chore: advance broker attempt schema to v3"
          git push origin HEAD:agent/execution-protection-foundation-staging
