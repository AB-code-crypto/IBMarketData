name: Temporary reverse submit safety patch

on:
  push:
    branches:
      - agent/reverse-handoff

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reverse-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reverse submit patch
        run: python scripts/_patch_reverse_submit_guard_temp.py
      - name: Commit patched sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/ibmd/execution/application/paper_submit.py \
            src/ibmd/execution/application/reverse_handoff.py \
            apps/run_execution_submit_v2.py
          git diff --cached --quiet || git commit -m "Require protective handoff before reverse submit"
          git push origin HEAD:agent/reverse-handoff
