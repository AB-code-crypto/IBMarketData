name: Temporary liquidation recovery-before-request patch

on:
  push:
    branches:
      - agent/liquidation-recovery-before-request
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/liquidation-recovery-before-request
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch once
        run: |
          if grep -q "initial_state: LiquidationStateObservationV1 | None" src/ibmd/operations/paper_liquidation_acceptance.py; then
            echo "Patch already applied"
            exit 0
          fi
          python scripts/_apply_liquidation_recovery_before_request.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ibmd/operations/paper_liquidation_acceptance.py tester/target_paper_liquidation_acceptance_tester.py
          git commit -m "Recover closed liquidation before creating request"
          git push origin HEAD:agent/liquidation-recovery-before-request
