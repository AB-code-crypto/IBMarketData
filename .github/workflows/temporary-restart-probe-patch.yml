name: Temporary restart probe entrypoint patch

on:
  push:
    branches:
      - agent/paper-restart-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paper-restart-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch paper entrypoints
        run: |
          python scripts/_patch_restart_probe_entrypoints_temp.py
          rm scripts/_patch_restart_probe_entrypoints_temp.py
          rm .github/workflows/temporary-restart-probe-patch.yml
      - name: Commit generated entrypoint changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Add restart probe hooks to paper entrypoints"
          git push origin HEAD:agent/paper-restart-acceptance
