name: Temporary restart acceptance syntax fix

on:
  push:
    branches:
      - agent/paper-restart-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/paper-restart-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/_fix_restart_acceptance_temp.py
          rm scripts/_fix_restart_acceptance_temp.py
          rm .github/workflows/temporary-restart-acceptance-fix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Fix restart acceptance runner defaults"
          git push origin HEAD:agent/paper-restart-acceptance
