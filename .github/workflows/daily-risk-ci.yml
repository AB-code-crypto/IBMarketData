name: Daily risk CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/daily-risk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-daily-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-protection
      IBMD_DATA_ROOT: /tmp/ibmd-daily-risk-ci
      IBMD_APPLICATION_VERSION: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run daily risk and execution safety tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_execution_daily_risk_tester \
            tester.target_execution_reverse_finalization_tester \
            tester.target_execution_reverse_handoff_tester \
            tester.target_execution_liquidation_trigger_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_protection_tester \
            tester.target_execution_broker_attempt_tester \
            -v 2>&1 | tee daily-risk-tests.log

      - name: Upload daily risk test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-risk-tests
          path: daily-risk-tests.log

      - name: Fail when daily risk tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Validate fresh target schemas and entrypoint
        run: |
          rm -rf "$IBMD_DATA_ROOT"
          python scripts/run_target_migrations.py \
            --manifest migrations/execution.v1.json \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_protective_lifecycle_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_liquidation_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_reverse_finalization_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_daily_risk_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_target_migrations.py \
            --manifest migrations/market_data.v1.json \
            --database "$IBMD_DATA_ROOT/market_data/MNQ.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_execution_daily_risk_v2.py --validate-store-only
          python apps/run_execution_daily_risk_v2.py --help >/dev/null

      - name: Compile and lint daily risk files
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m compileall -q \
            apps/run_execution_daily_risk_v2.py \
            scripts/run_execution_daily_risk_schema.py \
            src/ibmd/public_contracts/daily_risk.py \
            src/ibmd/execution/domain/daily_risk.py \
            src/ibmd/execution/application/daily_risk.py \
            src/ibmd/execution/adapters/sqlite_daily_risk_sources.py \
            src/ibmd/execution/adapters/sqlite_daily_risk_store.py \
            tester/target_execution_daily_risk_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_daily_risk_v2.py \
            scripts/run_execution_daily_risk_schema.py \
            src/ibmd/public_contracts/daily_risk.py \
            src/ibmd/execution/domain/daily_risk.py \
            src/ibmd/execution/application/daily_risk.py \
            src/ibmd/execution/adapters/sqlite_daily_risk_sources.py \
            src/ibmd/execution/adapters/sqlite_daily_risk_store.py \
            tester/target_execution_daily_risk_tester.py \
            2>&1 | tee daily-risk-lint.log

      - name: Upload daily risk lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: daily-risk-lint
          path: daily-risk-lint.log

      - name: Fail when daily risk lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
