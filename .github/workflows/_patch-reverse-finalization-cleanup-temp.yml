name: Temporary reverse finalization cleanup

on:
  push:
    branches:
      - agent/reverse-finalization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reverse-finalization
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_reverse_finalization_cleanup_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/execution/adapters/sqlite_reverse_finalization.py
          git diff --cached --quiet || git commit -m "Clean reverse commission refresh"
          git push origin HEAD:agent/reverse-finalization
