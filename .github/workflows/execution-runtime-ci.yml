name: Execution runtime CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/execution-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-execution-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: execution-runtime-test
      IBMD_DATA_ROOT: /tmp/ibmd-execution-runtime-ci
      IBMD_APPLICATION_VERSION: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run runtime and safety tests
        run: |
          python -m unittest \
            tester.target_execution_runtime_tester \
            tester.target_execution_runtime_reader_tester \
            tester.target_execution_reverse_finalization_tester \
            tester.target_execution_reverse_handoff_tester \
            tester.target_execution_daily_risk_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_liquidation_trigger_tester \
            tester.target_execution_protective_lifecycle_tester \
            tester.target_execution_paper_order_regression_tester \
            -v

      - name: Validate fresh target schemas and runtime entrypoint
        run: |
          rm -rf "$IBMD_DATA_ROOT"
          python scripts/run_target_migrations.py \
            --manifest migrations/execution.v1.json \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_protective_lifecycle_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_liquidation_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_reverse_finalization_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_daily_risk_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_target_migrations.py \
            --manifest migrations/decision.v1.json \
            --database "$IBMD_DATA_ROOT/decision/decision.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_target_migrations.py \
            --manifest migrations/position_feed.v1.json \
            --database "$IBMD_DATA_ROOT/position_feed/broker_positions.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_target_migrations.py \
            --manifest migrations/market_data.v1.json \
            --database "$IBMD_DATA_ROOT/market_data/MNQ.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_execution_runtime_v2.py --validate-store-only
          python apps/run_execution_runtime_v2.py --help >/dev/null

      - name: Compile and lint runtime files
        run: |
          python -m compileall -q \
            apps/run_execution_runtime_v2.py \
            src/ibmd/execution/application/runtime.py \
            src/ibmd/execution/application/runtime_steps.py \
            src/ibmd/execution/adapters/sqlite_runtime.py \
            tester/target_execution_runtime_tester.py \
            tester/target_execution_runtime_reader_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_runtime_v2.py \
            src/ibmd/execution/application/runtime.py \
            src/ibmd/execution/application/runtime_steps.py \
            src/ibmd/execution/adapters/sqlite_runtime.py \
            tester/target_execution_runtime_tester.py \
            tester/target_execution_runtime_reader_tester.py
