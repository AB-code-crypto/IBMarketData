name: Target supervisor CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/target-supervisor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-target-supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: supervisor-ci
      IBMD_DATA_ROOT: /tmp/ibmd-supervisor-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run supervisor and health safety tests
        run: |
          python -m unittest \
            tester.target_supervisor_tester \
            tester.target_foundation_tester \
            tester.target_execution_runtime_tester \
            tester.target_decision_runtime_tester \
            -v

      - name: Bootstrap a target root and validate the plan
        run: |
          rm -rf /tmp/ibmd-supervisor-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_target_supervisor.py --validate-only
          python apps/run_target_supervisor.py --print-plan \
            > /tmp/ibmd-supervisor-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/ibmd-supervisor-plan.json').read_text())
          assert [item['service'] for item in value['services']] == [
              'market_data',
              'broker_position_feed',
              'signal',
              'decision',
              'execution',
          ]
          assert value['automatic_restart_enabled'] is False
          assert value['trading_database_access'] is False
          assert value['continuous_broker_mutations_enabled'] is False
          assert '--allow-unqualified-session' in value['services'][-1]['argv']
          PY

      - name: Prove supervisor imports no database, broker or service internals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path('apps/run_target_supervisor.py'),
              Path('src/ibmd/operations/supervisor.py'),
          ]
          forbidden_roots = {
              'sqlite3',
              'ib_async',
              'ibmd.market_data',
              'ibmd.position_feed',
              'ibmd.signal',
              'ibmd.decision',
              'ibmd.execution',
              'ibmd.ib_gateway',
          }
          forbidden_calls = {'placeOrder', 'cancelOrder'}
          problems = []
          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [item.name for item in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or '']
                  else:
                      names = []
                  for name in names:
                      if any(name == root or name.startswith(root + '.') for root in forbidden_roots):
                          problems.append(f'{path}: forbidden import {name}')
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in forbidden_calls:
                          problems.append(f'{path}: forbidden call {node.func.attr}')
          if problems:
              raise SystemExit('\n'.join(problems))
          PY

      - name: Compile and lint supervisor files
        run: |
          python -m compileall -q \
            apps/run_target_supervisor.py \
            src/ibmd/operations/supervisor.py \
            tester/target_supervisor_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_target_supervisor.py \
            src/ibmd/operations/supervisor.py \
            tester/target_supervisor_tester.py
