name: Paper policy liquidation acceptance CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/policy-liquidation-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-paper-policy-liquidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-policy-liquidation-ci
      IBMD_DATA_ROOT: /tmp/ibmd-policy-liquidation-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run policy liquidation and trigger tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_paper_policy_liquidation_acceptance_tester \
            tester.target_paper_liquidation_acceptance_tester \
            tester.target_paper_liquidation_restart_acceptance_tester \
            tester.target_execution_liquidation_trigger_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_paper_liquidation_tester \
            -v 2>&1 | tee /tmp/policy-liquidation-tests.txt

      - name: Upload policy liquidation test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paper-policy-liquidation-tests
          path: /tmp/policy-liquidation-tests.txt

      - name: Fail when policy liquidation tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Validate on a fresh target deployment
        run: |
          rm -rf /tmp/ibmd-policy-liquidation-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/prepare_execution_policy_liquidation_paper_drill_v2.py \
            --validate-store-only
          python scripts/run_paper_policy_liquidation_acceptance.py \
            --validate-only \
            > /tmp/policy-liquidation-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path('/tmp/policy-liquidation-validation.json').read_text()
          )
          assert value[
              'paper_policy_liquidation_dependencies_compatible'
          ] is True
          assert value['supported_scenarios'] == [
              'DAILY_FLAT', 'ROLLOVER'
          ]
          assert value['interactive_confirmation_required'] is False
          assert value['automatic_retry_enabled'] is False
          PY

      - name: Prove preparer is broker-free and runner non-interactive
        run: |
          ! grep -R "placeOrder\|cancelOrder\|ib_async" \
            apps/prepare_execution_policy_liquidation_paper_drill_v2.py \
            src/ibmd/operations/paper_policy_liquidation_acceptance.py \
            scripts/run_paper_policy_liquidation_acceptance.py
          ! grep -R "Read-Host\|input(" \
            src/ibmd/operations/paper_policy_liquidation_acceptance.py \
            scripts/run_paper_policy_liquidation_acceptance.py

      - name: Compile policy liquidation files
        run: |
          python -m compileall -q \
            apps/prepare_execution_policy_liquidation_paper_drill_v2.py \
            scripts/run_paper_policy_liquidation_acceptance.py \
            src/ibmd/operations/paper_policy_liquidation_acceptance.py \
            tester/target_paper_policy_liquidation_acceptance_tester.py

      - name: Lint policy liquidation files
        id: lint
        continue-on-error: true
        run: |
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/prepare_execution_policy_liquidation_paper_drill_v2.py \
            scripts/run_paper_policy_liquidation_acceptance.py \
            src/ibmd/operations/paper_policy_liquidation_acceptance.py \
            tester/target_paper_policy_liquidation_acceptance_tester.py \
            2>&1 | tee /tmp/policy-liquidation-lint.txt

      - name: Upload policy liquidation lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paper-policy-liquidation-lint
          path: /tmp/policy-liquidation-lint.txt

      - name: Fail when policy liquidation lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
