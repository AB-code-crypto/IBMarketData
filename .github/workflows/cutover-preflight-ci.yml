name: Cutover preflight CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/cutover-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cutover-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-soak-cutover-ci
      IBMD_DATA_ROOT: /tmp/ibmd-cutover-ci/account1
      IBMD_APPLICATION_VERSION: cutover-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run preflight, manifest and safety tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_cutover_preflight_tester \
            tester.target_deployment_bootstrap_tester \
            tester.target_supervisor_tester \
            tester.target_paper_daily_halt_acceptance_tester \
            tester.target_paper_reverse_acceptance_tester \
            -v 2>&1 | tee /tmp/cutover-preflight-tests.txt

      - name: Upload preflight test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-preflight-tests
          path: /tmp/cutover-preflight-tests.txt

      - name: Fail when preflight tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Bootstrap a fresh target deployment
        run: |
          rm -rf /tmp/ibmd-cutover-ci /tmp/cutover-summary-source
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply

      - name: Generate CI acceptance summary fixtures
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str((Path.cwd() / 'src').resolve()))

          from ibmd.foundation.atomic_json import atomic_write_json
          from ibmd.operations.acceptance_manifest import AcceptanceGate
          from tester.target_cutover_preflight_tester import summary

          root = Path('/tmp/cutover-summary-source')
          root.mkdir(parents=True, exist_ok=True)
          for gate in AcceptanceGate:
              atomic_write_json(
                  root / f'{gate.value.lower()}.json',
                  summary(gate),
              )
          PY

      - name: Build and verify immutable acceptance manifest
        run: |
          python scripts/build_target_acceptance_manifest.py \
            --build \
            --entry-summary /tmp/cutover-summary-source/entry_protection.json \
            --liquidation-summary /tmp/cutover-summary-source/liquidation.json \
            --restart-summary /tmp/cutover-summary-source/restart.json \
            --liquidation-restart-summary /tmp/cutover-summary-source/liquidation_restart.json \
            --reverse-summary /tmp/cutover-summary-source/reverse.json \
            --daily-halt-summary /tmp/cutover-summary-source/daily_halt.json \
            --daily-flat-summary /tmp/cutover-summary-source/daily_flat.json \
            --rollover-summary /tmp/cutover-summary-source/rollover.json \
            > /tmp/acceptance-manifest-build.json
          python scripts/build_target_acceptance_manifest.py \
            --validate \
            > /tmp/acceptance-manifest-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('build', 'validation'):
              value = json.loads(
                  Path(f'/tmp/acceptance-manifest-{name}.json').read_text()
              )
              assert value['gate_count'] == 8
              assert value['all_summary_hashes_verified'] is True
              assert value['automatic_retry_enabled'] is False
          PY

      - name: Issue paper-soak authorization through preflight
        run: |
          python scripts/run_target_cutover_preflight.py \
            --mode PAPER_SOAK \
            --issue-authorization \
            --allow-unqualified-session \
            --legacy-runtime-dir /tmp/no-legacy-runtime \
            > /tmp/cutover-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/cutover-preflight.json').read_text())
          assert value['ready'] is True
          assert value['blocking_failures'] == []
          assert value['authorization'][
              'continuous_broker_mutations_authorized'
          ] is True
          assert value['authorization']['live_account_enablement'] is False
          authorization = Path(value['authorization_file'])
          assert authorization.is_file()
          PY

      - name: Prove live cutover remains blocked
        run: |
          ! python scripts/run_target_cutover_preflight.py \
            --mode LIVE_CUTOVER \
            --check \
            --legacy-runtime-dir /tmp/no-legacy-runtime \
            > /tmp/live-cutover-blocked.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/live-cutover-blocked.json').read_text())
          assert value['ready'] is False
          assert 'live_account_enablement' in value['blocking_failures']
          PY

      - name: Compile preflight files
        run: |
          python -m compileall -q \
            scripts/build_target_acceptance_manifest.py \
            scripts/run_target_cutover_preflight.py \
            src/ibmd/operations/acceptance_manifest.py \
            src/ibmd/operations/cutover_preflight.py \
            tester/target_cutover_preflight_tester.py

      - name: Lint preflight files
        id: lint
        continue-on-error: true
        run: |
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            scripts/build_target_acceptance_manifest.py \
            scripts/run_target_cutover_preflight.py \
            src/ibmd/operations/acceptance_manifest.py \
            src/ibmd/operations/cutover_preflight.py \
            tester/target_cutover_preflight_tester.py \
            2>&1 | tee /tmp/cutover-preflight-lint.txt

      - name: Upload preflight lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-preflight-lint
          path: /tmp/cutover-preflight-lint.txt

      - name: Fail when preflight lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
