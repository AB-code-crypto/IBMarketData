name: Temporary session CI fix

on:
  push:
    branches:
      - agent/session-calendar-qualification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-calendar-qualification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_session_ci_failure_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tester/target_execution_liquidation_trigger_tester.py \
            tester/target_cme_session_calendar_tester.py
          git diff --cached --quiet || git commit -m "Fix bounded session test fixtures"
          git push origin HEAD:agent/session-calendar-qualification
