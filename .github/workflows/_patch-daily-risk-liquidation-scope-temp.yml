name: Temporary daily risk liquidation scope fix

on:
  push:
    branches:
      - agent/daily-risk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-risk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_daily_risk_liquidation_scope_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/ibmd/execution/application/daily_risk.py \
            src/ibmd/execution/adapters/sqlite_daily_risk_sources.py \
            src/ibmd/execution/domain/daily_risk.py \
            tester/target_execution_daily_risk_tester.py
          git diff --cached --quiet || git commit -m "Scope daily risk liquidation to current episode"
          git push origin HEAD:agent/daily-risk
