name: Temporary target bootstrap patch

on:
  push:
    branches:
      - agent/target-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_target_bootstrap_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/ibmd/operations/bootstrap/target.py \
            tester/target_deployment_bootstrap_tester.py
          git diff --cached --quiet || git commit -m "Harden target bootstrap validation"
          git push origin HEAD:agent/target-bootstrap
