name: Temporary liquidation restart initial advance integration

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-liquidation-restart-final-ci
      IBMD_DATA_ROOT: /tmp/ibmd-liquidation-restart-final/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/liquidation-restart-initial-advance-final
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Apply initial advance patch
        run: python scripts/_tmp_patch_liquidation_restart_initial_advance_final.py

      - name: Remove fixable lint debt in touched files
        run: |
          ruff check --fix --select F401 \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py \
            tester/target_paper_liquidation_restart_acceptance_tester.py

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run liquidation and acceptance regression tests
        run: |
          python -m unittest \
            tester.target_paper_liquidation_restart_acceptance_tester \
            tester.target_paper_liquidation_acceptance_tester \
            tester.target_paper_restart_acceptance_tester \
            tester.target_execution_liquidation_tester \
            tester.target_cutover_preflight_tester \
            -v

      - name: Validate fresh target configuration
        run: |
          rm -rf "$IBMD_DATA_ROOT"
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_paper_liquidation_restart_acceptance.py \
            --validate-only \
            > /tmp/liquidation-restart-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path('/tmp/liquidation-restart-validation.json').read_text()
          )
          assert value['paper_liquidation_restart_dependencies_compatible'] is True
          assert value['initial_advance_broker_free'] is True
          assert value['oca_sibling_auto_cancel_supported'] is True
          assert value['automatic_retry_enabled'] is False
          PY

      - name: Compile patched files
        run: |
          python -m compileall -q \
            scripts/run_paper_liquidation_restart_acceptance.py \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py \
            tester/target_paper_liquidation_restart_acceptance_tester.py

      - name: Lint patched files
        run: |
          ruff check --select E4,E7,E9,F --ignore E402 \
            scripts/run_paper_liquidation_restart_acceptance.py \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py \
            tester/target_paper_liquidation_restart_acceptance_tester.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/_tmp_patch_liquidation_restart_initial_advance_final.py
          rm .github/workflows/_tmp_liquidation_restart_initial_advance_final.yml

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix liquidation restart initial advance"
          git push origin HEAD:agent/liquidation-restart-initial-advance-final
