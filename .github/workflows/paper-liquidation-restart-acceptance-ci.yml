name: Paper liquidation restart acceptance CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/paper-liquidation-restart-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-paper-liquidation-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-liquidation-restart-ci
      IBMD_DATA_ROOT: /tmp/ibmd-liquidation-restart-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run liquidation restart and broker-safety tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_paper_liquidation_restart_acceptance_tester \
            tester.target_paper_liquidation_acceptance_tester \
            tester.target_paper_restart_acceptance_tester \
            tester.target_execution_liquidation_tester \
            -v 2>&1 | tee /tmp/liquidation-restart-tests.txt

      - name: Upload liquidation restart test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paper-liquidation-restart-tests
          path: /tmp/liquidation-restart-tests.txt

      - name: Fail when liquidation restart tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Validate on a fresh target deployment
        run: |
          rm -rf /tmp/ibmd-liquidation-restart-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_paper_liquidation_restart_acceptance.py \
            --validate-only \
            > /tmp/liquidation-restart-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(
              Path('/tmp/liquidation-restart-validation.json').read_text()
          )
          assert value[
              'paper_liquidation_restart_dependencies_compatible'
          ] is True
          assert value['intentional_child_exit_code'] == 86
          assert value['restart_actions'] == [
              'CANCEL_TAKE_PROFIT',
              'CANCEL_STOP',
              'SUBMIT_MARKET_CLOSE',
          ]
          assert value['automatic_retry_enabled'] is False
          PY

      - name: Prove drill flag is explicit and non-interactive
        run: |
          python apps/run_execution_liquidation_v2.py --help \
            | grep -- '--drill-crash-after-broker-action'
          ! grep -R "Read-Host\|input(" \
            scripts/run_paper_liquidation_restart_acceptance.py \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py

      - name: Compile liquidation restart files
        run: |
          python -m compileall -q \
            apps/run_execution_liquidation_v2.py \
            scripts/run_paper_liquidation_restart_acceptance.py \
            src/ibmd/operations/restart_probe.py \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py \
            tester/target_paper_liquidation_restart_acceptance_tester.py

      - name: Lint liquidation restart files
        id: lint
        continue-on-error: true
        run: |
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_liquidation_v2.py \
            scripts/run_paper_liquidation_restart_acceptance.py \
            src/ibmd/operations/restart_probe.py \
            src/ibmd/operations/paper_liquidation_restart_acceptance.py \
            tester/target_paper_liquidation_restart_acceptance_tester.py \
            2>&1 | tee /tmp/liquidation-restart-lint.txt

      - name: Upload liquidation restart lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paper-liquidation-restart-lint
          path: /tmp/liquidation-restart-lint.txt

      - name: Fail when liquidation restart lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
