name: Paper restart acceptance CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/paper-restart-acceptance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-paper-restart-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: paper-drill-restart-ci
      IBMD_DATA_ROOT: /tmp/ibmd-paper-restart-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run restart runner and broker-safety tests
        run: |
          python -m unittest \
            tester.target_paper_restart_acceptance_tester \
            tester.target_paper_acceptance_drill_tester \
            tester.target_execution_paper_submit_tester \
            tester.target_execution_protective_submit_tester \
            tester.target_execution_paper_order_regression_tester \
            -v

      - name: Validate on a fresh target deployment
        run: |
          rm -rf /tmp/ibmd-paper-restart-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_paper_restart_acceptance.py --validate-only \
            > /tmp/paper-restart-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/paper-restart-validation.json').read_text())
          assert value['paper_restart_acceptance_dependencies_compatible'] is True
          assert value['intentional_child_exit_code'] == 86
          assert value['automatic_retry_enabled'] is False
          assert value['intentional_process_terminations'] == [
              'MARKET_ENTRY', 'STOP_LOSS', 'TAKE_PROFIT'
          ]
          PY

      - name: Prove drill flags are explicit and non-interactive
        run: |
          python apps/run_execution_submit_v2.py --help \
            | grep -- '--drill-crash-after-submit'
          python apps/run_execution_protective_submit_v2.py --help \
            | grep -- '--drill-crash-after-submit'
          ! grep -R "Read-Host\|input(" \
            scripts/run_paper_restart_acceptance.py \
            src/ibmd/operations/paper_restart_acceptance.py

      - name: Compile restart acceptance files
        run: |
          python -m compileall -q \
            apps/run_execution_submit_v2.py \
            apps/run_execution_protective_submit_v2.py \
            scripts/run_paper_restart_acceptance.py \
            src/ibmd/operations/restart_probe.py \
            src/ibmd/operations/paper_restart_acceptance.py \
            tester/target_paper_restart_acceptance_tester.py

      - name: Lint restart acceptance files
        id: lint
        continue-on-error: true
        run: |
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_execution_submit_v2.py \
            apps/run_execution_protective_submit_v2.py \
            scripts/run_paper_restart_acceptance.py \
            src/ibmd/operations/restart_probe.py \
            src/ibmd/operations/paper_restart_acceptance.py \
            tester/target_paper_restart_acceptance_tester.py \
            2>&1 | tee /tmp/paper-restart-lint.txt

      - name: Upload restart lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: paper-restart-acceptance-lint
          path: /tmp/paper-restart-lint.txt

      - name: Fail when restart lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
