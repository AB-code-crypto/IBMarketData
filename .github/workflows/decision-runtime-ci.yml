name: Decision runtime CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/decision-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-decision-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: decision-runtime-ci
      IBMD_DATA_ROOT: /tmp/ibmd-decision-runtime-ci/account1
      IBMD_APPLICATION_VERSION: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run decision runtime and safety tests
        run: |
          python -m unittest \
            tester.target_decision_runtime_tester \
            tester.target_decision_tester \
            tester.target_execution_foundation_tester \
            tester.target_execution_runtime_reader_tester \
            -v

      - name: Validate on a fresh target deployment
        run: |
          rm -rf /tmp/ibmd-decision-runtime-ci
          python scripts/bootstrap_target_deployment.py \
            --target-root "$IBMD_DATA_ROOT" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_decision_runtime_v2.py --validate-store-only
          python apps/run_decision_runtime_v2.py --once

      - name: Prove broker libraries are absent
        run: |
          ! grep -R "ib_async\|placeOrder\|cancelOrder" \
            apps/run_decision_runtime_v2.py \
            src/ibmd/decision/application/runtime.py \
            src/ibmd/decision/adapters/sqlite_runtime.py

      - name: Compile and lint decision runtime files
        run: |
          python -m compileall -q \
            apps/run_decision_runtime_v2.py \
            src/ibmd/decision/application/runtime.py \
            src/ibmd/decision/adapters/sqlite_runtime.py \
            tester/target_decision_runtime_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            apps/run_decision_runtime_v2.py \
            src/ibmd/decision/application/runtime.py \
            src/ibmd/decision/adapters/sqlite_runtime.py \
            tester/target_decision_runtime_tester.py
