name: Temporary execution runtime patch

on:
  push:
    branches:
      - agent/execution-runtime

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/execution-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_execution_runtime_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/run_execution_runtime_v2.py \
            src/ibmd/execution/application/runtime.py \
            tester/target_execution_runtime_tester.py
          git diff --cached --quiet || git commit -m "Harden execution runtime kernel"
          git push origin HEAD:agent/execution-runtime
