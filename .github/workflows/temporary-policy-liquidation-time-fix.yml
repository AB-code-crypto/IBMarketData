name: Temporary policy liquidation time fix

on:
  push:
    branches:
      - agent/policy-liquidation-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/policy-liquidation-acceptance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/_fix_policy_liquidation_time_temp.py
          rm scripts/_fix_policy_liquidation_time_temp.py
          rm .github/workflows/temporary-policy-liquidation-time-fix.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Normalize policy trigger timestamps"
          git push origin HEAD:agent/policy-liquidation-acceptance
