name: Temporary liquidation trigger patch

on:
  push:
    branches:
      - agent/liquidation-coordinator

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/liquidation-coordinator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact trigger patch
        run: python scripts/_patch_liquidation_trigger_idempotency_temp.py
      - name: Commit patched trigger handling
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/execution/domain/liquidation.py
          git diff --cached --quiet || git commit -m "Make liquidation triggers idempotent"
          git push origin HEAD:agent/liquidation-coordinator
