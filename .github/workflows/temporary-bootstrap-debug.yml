name: Temporary bootstrap diagnostics

on:
  push:
    branches:
      - agent/target-bootstrap

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Capture failing test output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tester.target_deployment_bootstrap_tester \
            tester.target_market_data_migration_tester \
            tester.target_execution_broker_attempt_tester \
            tester.target_execution_daily_risk_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_reverse_finalization_tester \
            -v > bootstrap-debug.log 2>&1
          status=$?
          echo "exit_code=$status" >> bootstrap-debug.log
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap-debug.log
          git diff --cached --quiet || git commit -m "Capture bootstrap test failure"
          git push origin HEAD:agent/target-bootstrap
