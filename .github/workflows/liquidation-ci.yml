name: Liquidation coordinator CI

on:
  pull_request:
    branches:
      - master
      - agent/architecture-rewrite
  push:
    branches:
      - agent/liquidation-coordinator
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-production-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/ib-completed-order-zero-id
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch once
        run: |
          if grep -q "broker_order_id: int | None" \
            src/ibmd/public_contracts/broker_reconciliation.py; then
            echo "Production patch is already present"
            exit 0
          fi
          python scripts/_apply_completed_order_zero_id_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ibmd/public_contracts/broker_reconciliation.py \
            src/ibmd/ib_gateway/broker_reconciliation_mapping.py \
            src/ibmd/execution/domain/ib_reconciliation.py \
            src/ibmd/execution/domain/protective_submission.py \
            src/ibmd/execution/domain/liquidation_reconciliation.py \
            src/ibmd/execution/domain/broker_attempt.py \
            src/ibmd/execution/domain/protection.py \
            src/ibmd/execution/domain/liquidation.py
          git commit -m "Handle IB completed orders without API order id"
          git push origin HEAD:agent/ib-completed-order-zero-id

  validate-liquidation:
    needs: apply-production-patch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      IB_HOST: 127.0.0.1
      IB_PORT: "7497"
      IB_CLIENT_ID: "200"
      IB_ACCOUNT_ID: DU000000
      IBMD_ENVIRONMENT: paper
      IBMD_DEPLOYMENT_ID: liquidation-ci
      IBMD_DATA_ROOT: /tmp/ibmd-liquidation-ci
      IBMD_APPLICATION_VERSION: ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Verify architecture boundaries
        run: python scripts/verify_target_architecture.py .

      - name: Run liquidation and recovery tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest \
            tester.target_ib_completed_order_zero_id_tester \
            tester.target_execution_liquidation_tester \
            tester.target_execution_liquidation_invariants_tester \
            tester.target_execution_paper_liquidation_tester \
            tester.target_execution_protective_lifecycle_tester \
            tester.target_execution_protective_submit_tester \
            tester.target_execution_broker_attempt_tester \
            tester.target_ib_broker_reconciliation_tester \
            -v 2>&1 | tee liquidation-tests.log

      - name: Upload liquidation test diagnostics
        if: steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-tests
          path: liquidation-tests.log

      - name: Fail when liquidation tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Validate fresh target schemas and entrypoint
        run: |
          rm -rf "$IBMD_DATA_ROOT"
          python scripts/run_target_migrations.py \
            --manifest migrations/execution.v1.json \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_execution_liquidation_schema.py \
            --database "$IBMD_DATA_ROOT/execution/execution.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python scripts/run_target_migrations.py \
            --manifest migrations/position_feed.v1.json \
            --database "$IBMD_DATA_ROOT/position_feed/broker_positions.sqlite3" \
            --application-version "$IBMD_APPLICATION_VERSION" \
            --apply
          python apps/run_execution_liquidation_v2.py --validate-store-only
          python apps/run_execution_liquidation_v2.py --help >/dev/null

      - name: Compile and lint liquidation files
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          python -m compileall -q \
            apps/run_execution_liquidation_v2.py \
            scripts/run_execution_liquidation_schema.py \
            src/ibmd/public_contracts/liquidation.py \
            src/ibmd/public_contracts/broker_reconciliation.py \
            src/ibmd/execution/domain/liquidation.py \
            src/ibmd/execution/domain/liquidation_completion.py \
            src/ibmd/execution/domain/liquidation_exits.py \
            src/ibmd/execution/domain/liquidation_position.py \
            src/ibmd/execution/domain/liquidation_reconciliation.py \
            src/ibmd/execution/application/liquidation.py \
            src/ibmd/execution/application/paper_liquidation.py \
            src/ibmd/execution/adapters/sqlite_liquidation.py \
            src/ibmd/ib_gateway/broker_reconciliation_mapping.py \
            src/ibmd/ib_gateway/paper_cancellations.py \
            src/ibmd/ib_gateway/fake_paper_cancellations.py \
            src/ibmd/ib_gateway/ib_async_paper_cancellations.py \
            tester/target_ib_completed_order_zero_id_tester.py \
            tester/target_execution_liquidation_tester.py \
            tester/target_execution_liquidation_invariants_tester.py \
            tester/target_execution_paper_liquidation_tester.py
          ruff check \
            --select E4,E7,E9,F \
            --ignore E402 \
            src/ibmd/public_contracts/broker_reconciliation.py \
            src/ibmd/ib_gateway/broker_reconciliation_mapping.py \
            src/ibmd/execution/domain/ib_reconciliation.py \
            src/ibmd/execution/domain/protective_submission.py \
            src/ibmd/execution/domain/liquidation_reconciliation.py \
            src/ibmd/execution/domain/broker_attempt.py \
            src/ibmd/execution/domain/protection.py \
            src/ibmd/execution/domain/liquidation.py \
            tester/target_ib_completed_order_zero_id_tester.py \
            2>&1 | tee liquidation-lint.log

      - name: Upload liquidation lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: liquidation-lint
          path: liquidation-lint.log

      - name: Fail when liquidation lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
