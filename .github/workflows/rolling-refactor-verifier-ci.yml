name: Rolling refactor verifier CI

on:
  pull_request:
    branches:
      - agent/architecture-rewrite
      - master
  push:
    branches:
      - agent/fix-rolling-verifier-scope
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rolling-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Run verifier scope tests
        run: |
          python -m unittest \
            tester.rolling_refactor_verifier_scope_tester \
            -v

      - name: Verify current legacy rolling runtime
        run: python scripts/verify_rolling_refactor.py .

      - name: Verify target architecture independently
        run: python scripts/verify_target_architecture.py .

      - name: Compile and lint verifier files
        run: |
          python -m compileall -q \
            scripts/verify_rolling_refactor.py \
            tester/rolling_refactor_verifier_scope_tester.py
          ruff check \
            --select E4,E7,E9,F \
            scripts/verify_rolling_refactor.py \
            tester/rolling_refactor_verifier_scope_tester.py
