name: Temporary daily risk test schema patch

on:
  push:
    branches:
      - agent/daily-risk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-risk
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_daily_risk_test_schema_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tester/target_execution_daily_risk_tester.py
          git diff --cached --quiet || git commit -m "Fix daily risk test component setup"
          git push origin HEAD:agent/daily-risk
