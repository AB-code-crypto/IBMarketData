name: Temporary supervisor lint patch

on:
  pull_request:
    branches:
      - agent/architecture-rewrite

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/target-supervisor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/_patch_supervisor_lint_temp.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/operations/supervisor.py
          git diff --cached --quiet || git commit -m "Remove unused supervisor import"
          git push origin HEAD:agent/target-supervisor
