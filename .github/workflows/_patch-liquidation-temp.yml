name: Temporary liquidation patch

on:
  push:
    branches:
      - agent/liquidation-coordinator

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/liquidation-coordinator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source patch
        run: python scripts/_patch_paper_liquidation_temp.py
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/ibmd/execution/application/paper_liquidation.py
          git diff --cached --quiet || git commit -m "Harden liquidation recovery and flat completion"
          git push origin HEAD:agent/liquidation-coordinator
